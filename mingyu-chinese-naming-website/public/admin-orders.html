<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>游客订单后台 | Mingyu</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/admin.css?v=20260828-plan-admin-db" />
</head>
<body>
  <main class="admin-shell">
    <div class="admin-wrap">
      <header class="admin-topbar">
        <div>
          <a class="brand" href="/"><span class="brand-mark">名</span><span>名屿 <small>MINGYU</small></span></a>
          <p class="admin-muted" id="adminSessionText">正在检查后台登录状态...</p>
        </div>
        <div class="admin-topbar-actions">
          <a class="admin-link" href="/admin-plans.html">会员套餐管理</a>
          <a class="admin-link" href="/admin-feedback.html">大师留言</a>
          <a class="admin-link" href="/order-lookup.html">订单找回页</a>
          <button class="admin-ghost" type="button" id="adminLogoutBtn">退出登录</button>
        </div>
      </header>

      <section class="admin-panel admin-filters">
        <div class="admin-field">
          <span>订单状态</span>
          <select id="statusFilter">
            <option value="">全部</option>
            <option value="pending_payment">待付款</option>
            <option value="fulfilled">已完成</option>
          </select>
        </div>
        <div class="admin-field">
          <span>邮件状态</span>
          <select id="emailFilter">
            <option value="">全部</option>
            <option value="pending">待发送</option>
            <option value="sent">已发送</option>
            <option value="failed">发送失败</option>
          </select>
        </div>
        <div class="admin-field admin-field-grow">
          <span>搜索</span>
          <input id="searchInput" type="search" placeholder="订单号 / 邮箱 / 宝宝姓名" />
        </div>
        <button class="admin-primary" type="button" id="refreshOrdersBtn">刷新清单</button>
      </section>

      <p class="admin-message" id="ordersMessage"></p>

      <section class="admin-layout">
        <div class="admin-panel">
          <div class="admin-list-header">
            <h1>游客订单</h1>
            <strong id="ordersCount">0</strong>
          </div>
          <div class="admin-order-list" id="ordersList"></div>
        </div>

        <aside class="admin-panel admin-detail-panel">
          <div class="admin-list-header">
            <h2>订单详情</h2>
            <button class="admin-ghost" type="button" id="resendMailBtn" disabled>补发邮件</button>
          </div>
          <div id="orderDetailEmpty" class="admin-empty">请先从左侧选择一个订单。</div>
          <div id="orderDetailBox" hidden>
            <div class="admin-detail-grid" id="orderDetailMeta"></div>
            <div class="admin-detail-links" id="orderDetailLinks"></div>
            <section class="admin-subpanel">
              <h3>用户提交信息</h3>
              <pre id="orderFormBody"></pre>
            </section>
            <section class="admin-subpanel">
              <h3>结果摘要</h3>
              <pre id="orderResultBody"></pre>
            </section>
          </div>
        </aside>
      </section>
    </div>
  </main>
  <script src="/admin-orders.js?v=20260828-plan-admin-db"></script>
</body>
</html>
