<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>找回我的订单 | Mingyu</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/guest-order.css" />
</head>
<body>
  <main class="guest-shell">
    <div class="guest-wrap">
      <header class="guest-topbar">
        <a class="brand" href="/"><span class="brand-mark">名</span><span>名屿 <small>MINGYU</small></span></a>
        <nav>
          <a href="/">返回首页</a>
          <a href="/checkout-success.html">支付完成后继续</a>
        </nav>
      </header>

      <section class="guest-panel">
        <p class="guest-eyebrow">ORDER RECOVERY</p>
        <h2>通过邮箱和订单号找回结果</h2>
        <p>这个页面用于找回已经生成或已经保存的游客订单结果。若你曾经完成付款，或付款后页面关闭，可以输入下单时填写的邮箱和订单号，重新打开订单。</p>
        <div class="guest-note">
          <strong>审核说明：</strong> PayPal 商户审核期间，新的在线付款暂时关闭；订单找回页面继续公开，用于说明历史订单如何恢复，以及审核通过后买家如何再次查看数字交付结果。
        </div>
        <form class="guest-form" id="lookupForm">
          <label>
            <span>交付邮箱</span>
            <input name="email" type="email" required placeholder="you@example.com" autocomplete="email" />
          </label>
          <label>
            <span>订单号</span>
            <input name="orderId" required placeholder="guest_xxxxxxxxx" />
          </label>
          <button class="guest-primary" type="submit">找回我的订单</button>
        </form>
        <p class="guest-message" id="lookupMessage"></p>
      </section>
    </div>
  </main>

  <script src="/order-lookup.js"></script>
</body>
</html>
